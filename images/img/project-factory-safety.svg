<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="60" y1="0" x2="60" y2="380"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="180" y1="0" x2="180" y2="380"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="420" y1="0" x2="420" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
    <line x1="540" y1="0" x2="540" y2="380"/>
  </g>

  <!-- Factory background silhouette -->
  <rect x="0" y="280" width="600" height="100" fill="#0a1628"/>
  <rect x="30" y="220" width="80" height="160" fill="#0d1f36"/>
  <rect x="120" y="200" width="100" height="180" fill="#0d1f36"/>
  <rect x="230" y="230" width="60" height="150" fill="#0d1f36"/>
  <rect x="400" y="210" width="90" height="170" fill="#0d1f36"/>
  <rect x="500" y="240" width="80" height="140" fill="#0d1f36"/>
  <!-- Factory windows -->
  <rect x="45" y="235" width="20" height="15" fill="#1e40af" opacity="0.7"/>
  <rect x="75" y="235" width="20" height="15" fill="#1e40af" opacity="0.7"/>
  <rect x="135" y="215" width="20" height="15" fill="#1e40af" opacity="0.7"/>
  <rect x="165" y="215" width="20" height="15" fill="#1e40af" opacity="0.7"/>
  <rect x="135" y="245" width="20" height="15" fill="#f59e0b" opacity="0.5"/>
  <rect x="165" y="245" width="20" height="15" fill="#1e40af" opacity="0.7"/>

  <!-- Main worker figure (center) -->
  <!-- Body -->
  <rect x="260" y="170" width="50" height="70" rx="4" fill="#f59e0b"/>
  <!-- Hard hat -->
  <ellipse cx="285" cy="155" rx="28" ry="10" fill="#f59e0b"/>
  <ellipse cx="285" cy="148" rx="22" ry="16" fill="#f59e0b"/>
  <ellipse cx="285" cy="148" rx="18" ry="13" fill="#fbbf24"/>
  <!-- Visor -->
  <rect x="268" y="158" width="34" height="8" rx="2" fill="#93c5fd" opacity="0.8"/>
  <!-- Head -->
  <ellipse cx="285" cy="148" rx="14" ry="14" fill="#fde68a"/>
  <!-- Safety vest stripes -->
  <line x1="260" y1="185" x2="310" y2="185" stroke="#fb923c" stroke-width="3"/>
  <line x1="260" y1="198" x2="310" y2="198" stroke="#fb923c" stroke-width="3"/>
  <!-- Arms -->
  <rect x="235" y="172" width="28" height="14" rx="4" fill="#f59e0b"/>
  <rect x="307" y="172" width="28" height="14" rx="4" fill="#f59e0b"/>
  <!-- Gloves -->
  <ellipse cx="233" cy="179" rx="10" ry="8" fill="#1e3a5f"/>
  <ellipse cx="337" cy="179" rx="10" ry="8" fill="#1e3a5f"/>
  <!-- Legs -->
  <rect x="265" y="238" width="18" height="50" rx="3" fill="#1e3a5f"/>
  <rect x="288" y="238" width="18" height="50" rx="3" fill="#1e3a5f"/>
  <!-- Safety boots -->
  <ellipse cx="274" cy="290" rx="12" ry="6" fill="#374151"/>
  <ellipse cx="297" cy="290" rx="12" ry="6" fill="#374151"/>

  <!-- AI Detection bounding box -->
  <rect x="230" y="135" width="115" height="175" rx="4"
        fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="8,3" filter="url(#glow)"/>

  <!-- Corner markers -->
  <path d="M230,135 L230,148 M230,135 L243,135" stroke="#22c55e" stroke-width="3" fill="none"/>
  <path d="M345,135 L345,148 M345,135 L332,135" stroke="#22c55e" stroke-width="3" fill="none"/>
  <path d="M230,310 L230,297 M230,310 L243,310" stroke="#22c55e" stroke-width="3" fill="none"/>
  <path d="M345,310 L345,297 M345,310 L332,310" stroke="#22c55e" stroke-width="3" fill="none"/>

  <!-- Detection label -->
  <rect x="230" y="118" width="115" height="20" rx="3" fill="#22c55e"/>
  <text x="287" y="132" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a">WORKER ✓ 98.3%</text>

  <!-- PPE Detection boxes -->
  <!-- Helmet box -->
  <rect x="263" y="136" width="46" height="30" rx="2"
        fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="263" y="128" width="46" height="12" rx="2" fill="#3b82f6"/>
  <text x="286" y="137" text-anchor="middle" font-family="monospace" font-size="9" fill="white">HELMET ✓</text>

  <!-- Vest box -->
  <rect x="254" y="170" width="62" height="70" rx="2"
        fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="254" y="162" width="62" height="12" rx="2" fill="#f59e0b"/>
  <text x="285" y="171" text-anchor="middle" font-family="monospace" font-size="9" fill="#0f172a">VEST ✓</text>

  <!-- Gloves box -->
  <rect x="225" y="166" width="18" height="22" rx="2"
        fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="327" y="166" width="18" height="22" rx="2"
        fill="none" stroke="#a855f7" stroke-width="1.5"/>

  <!-- Scan line animation overlay -->
  <rect x="230" y="135" width="115" height="175" fill="url(#scanGrad)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="0,-175" to="0,175" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Neural network visualization (right side) -->
  <!-- Nodes layer 1 -->
  <circle cx="430" cy="100" r="6" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="430" cy="130" r="6" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="430" cy="160" r="6" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="430" cy="190" r="6" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="430" cy="220" r="6" fill="#3b82f6" filter="url(#glow)"/>

  <!-- Nodes layer 2 -->
  <circle cx="480" cy="115" r="6" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="480" cy="150" r="6" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="480" cy="185" r="6" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="480" cy="220" r="6" fill="#8b5cf6" filter="url(#glow)"/>

  <!-- Nodes layer 3 (output) -->
  <circle cx="530" cy="130" r="7" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="530" cy="170" r="7" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="530" cy="210" r="7" fill="#22c55e" filter="url(#glow)"/>

  <!-- Connections layer 1->2 -->
  <g stroke="#3b82f6" stroke-width="0.7" opacity="0.4">
    <line x1="436" y1="100" x2="474" y2="115"/>
    <line x1="436" y1="100" x2="474" y2="150"/>
    <line x1="436" y1="130" x2="474" y2="115"/>
    <line x1="436" y1="130" x2="474" y2="150"/>
    <line x1="436" y1="130" x2="474" y2="185"/>
    <line x1="436" y1="160" x2="474" y2="115"/>
    <line x1="436" y1="160" x2="474" y2="150"/>
    <line x1="436" y1="160" x2="474" y2="185"/>
    <line x1="436" y1="160" x2="474" y2="220"/>
    <line x1="436" y1="190" x2="474" y2="150"/>
    <line x1="436" y1="190" x2="474" y2="185"/>
    <line x1="436" y1="190" x2="474" y2="220"/>
    <line x1="436" y1="220" x2="474" y2="185"/>
    <line x1="436" y1="220" x2="474" y2="220"/>
  </g>

  <!-- Connections layer 2->3 -->
  <g stroke="#8b5cf6" stroke-width="0.7" opacity="0.4">
    <line x1="486" y1="115" x2="523" y2="130"/>
    <line x1="486" y1="115" x2="523" y2="170"/>
    <line x1="486" y1="150" x2="523" y2="130"/>
    <line x1="486" y1="150" x2="523" y2="170"/>
    <line x1="486" y1="185" x2="523" y2="170"/>
    <line x1="486" y1="185" x2="523" y2="210"/>
    <line x1="486" y1="220" x2="523" y2="170"/>
    <line x1="486" y1="220" x2="523" y2="210"/>
  </g>

  <!-- Neural net label -->
  <text x="480" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#60a5fa">CNN MODEL</text>
  <line x1="430" y1="80" x2="530" y2="80" stroke="#60a5fa" stroke-width="0.5" opacity="0.5"/>

  <!-- Stats panel (top left) -->
  <rect x="10" y="10" width="180" height="90" rx="6" fill="#0d1f36" opacity="0.9"/>
  <text x="20" y="28" font-family="monospace" font-size="11" font-weight="bold" fill="#60a5fa">AI SAFETY MONITOR</text>
  <rect x="10" y="32" width="180" height="1" fill="#1e3a5f"/>
  <text x="20" y="48" font-family="monospace" font-size="10" fill="#94a3b8">Accuracy:</text>
  <text x="150" y="48" text-anchor="end" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e">95.7%</text>
  <text x="20" y="63" font-family="monospace" font-size="10" fill="#94a3b8">PPE Detected:</text>
  <text x="150" y="63" text-anchor="end" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e">COMPLIANT</text>
  <text x="20" y="78" font-family="monospace" font-size="10" fill="#94a3b8">Violations:</text>
  <text x="150" y="78" text-anchor="end" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e">0</text>
  <text x="20" y="93" font-family="monospace" font-size="10" fill="#94a3b8">FPS:</text>
  <text x="150" y="93" text-anchor="end" font-family="monospace" font-size="10" font-weight="bold" fill="#60a5fa">30</text>

  <!-- Bottom title -->
  <rect x="0" y="335" width="600" height="45" fill="#0a1628" opacity="0.95"/>
  <text x="300" y="355" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#f0f9ff">AI-Based Factory Worker Safety Detection</text>
  <text x="300" y="373" text-anchor="middle" font-family="monospace" font-size="10" fill="#60a5fa">Python · CNN · Computer Vision · Real-Time PPE Detection</text>
</svg>
